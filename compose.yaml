services:
  gliner:
    image: ghcr.io/maxdswain/vllm-gliner:latest
    ports:
      - "8000:8000"
    gpus:
      - device_ids: ["0"] # Select device IDs supported by your container GPU runtime.
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    environment:
      HF_HOME: /root/.cache/huggingface
      MODEL_ID: fastino/gliner2.5-multi-v1
      MODEL_PLUGIN: deberta_gliner25
      IO_PLUGIN: deberta_gliner25_io
      DTYPE: bfloat16
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        vllm-factory-prep --model "$$MODEL_ID" --plugin "$$MODEL_PLUGIN" --output /models/current --force &&
        exec vllm serve /models/current
        --host 0.0.0.0 --port 8000
        --runner pooling --trust-remote-code --dtype "$$DTYPE"
        --no-enable-prefix-caching --no-enable-chunked-prefill
        --io-processor-plugin "$$IO_PLUGIN"

volumes:
  huggingface-cache:
